<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../images/autres/logo.png">
    <title>Notation Film - Critiverse</title>
    <link rel="stylesheet" href="../styles/animes.css">
    <style>
        main { display: block; }
        .details-container { display: flex; flex-wrap: wrap; gap: 40px; max-width: 1200px; margin: auto; padding: 40px; }
        .film-info { flex: 1 1 580px; min-width: 320px; }
        .film-top { display: flex; flex-wrap: wrap; gap: 30px; align-items: flex-start; }
        .film-cover { flex: 0 0 280px; }
        .film-cover img { width: 100%; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .film-summary { flex: 1; min-width: 260px; }
        .film-info h1 { margin-top: 0; color: #333; }

        .rating-section { flex: 1 1 320px; min-width: 320px; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); height: fit-content; margin-left: auto; }

        .star-rating { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 10px; margin: 15px 0; }
        .star-rating input { display: none; }
        .star-rating label { font-size: 45px; color: #ddd; cursor: pointer; transition: 0.2s; }
        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input:checked ~ label { color: #ffca08; }

        .synopsis-box { margin: 20px 0; line-height: 1.7; background: #f9f9f9; padding: 20px; border-radius: 10px; border-left: 4px solid #2f6df6; font-size: 15px; color: #444; }
        textarea { width: 100%; height: 120px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; resize: none; font-family: inherit; margin-bottom: 15px; box-sizing: border-box; }

        #submit-rating { background: #2f6df6; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; transition: 0.3s; }
        #submit-rating:hover { background: #1a52d5; }

        .reviews-area { max-width: 1200px; margin: 40px auto; padding: 0 40px; }
        .review-card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .stars-display { color: #ffca08; font-weight: bold; }
        .review-date { color: #888; font-size: 0.9em; }
    </style>
</head>
<body>

    <header>
        <div class="search">
            <img src="../images/autres/logo.png" class="logo">
            <input type="text" id="searchInput" placeholder="Rechercher un film...">
            <button type="button" onclick="searchFilm()">🔎</button>
            <button type="button">Se connecter</button>
            <button type="button">S'inscrire</button>
        </div>
    </header>

    <nav class="navbar">
        <ul>
            <li><a href="accueil.html">Accueil</a></li>
            <li><a href="actualités.html">Actualités</a></li>
            <li><a href="films.html">Films</a></li>
            <li><a href="séries.html">Séries</a></li>
            <li><a href="animes.html">Animes</a></li>
            <li><a href="critiques.html">Critiques Populaires</a></li>
        </ul>
        <ul>
            <li><a href="films.html?genre=28">Action</a></li>
            <li><a href="films.html?genre=35">Comédie</a></li>
            <li><a href="films.html?genre=18">Drame</a></li>
            <li><a href="films.html?genre=27">Horreur</a></li>
            <li><a href="films.html?genre=10749">Romance</a></li>
            <li><a href="films.html?genre=878">Science-Fiction</a></li>
            <li><a href="films.html?genre=53">Thriller</a></li>
            <li><a href="films.html?genre=12">Aventure</a></li>
        </ul>
    </nav>

    <main id="content">
        <div id="film-details-target" class="details-container">
            <p>Chargement du film...</p>
        </div>

        <section class="reviews-area">
            <hr>
            <h2>Avis des utilisateurs</h2>
            <div id="reviews-list">
                <p style="color: #999;">Soyez le premier à donner votre avis sur ce film !</p>
            </div>
        </section>
    </main>

    <script>
        const API_KEY = '7f41925d9303e23359cf5a62ee62de74';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL  = 'https://image.tmdb.org/t/p/w500';

        const params = new URLSearchParams(window.location.search);
        const movieId = params.get('id');
        let selectedScore = 0;

        function searchFilm() {
            const val = document.getElementById('searchInput').value.trim();
            if (val.length < 2) return alert("2 lettres minimum");
            window.location.href = `films.html?q=${encodeURIComponent(val)}`;
        }

        document.getElementById('searchInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') searchFilm();
        });

        async function loadFilmData() {
            if (!movieId) {
                document.getElementById('film-details-target').innerHTML = "<h2>Erreur : Aucun film sélectionné.</h2>";
                return;
            }

            try {
                const res  = await fetch(`${BASE_URL}/movie/${movieId}?api_key=${API_KEY}&language=fr-FR`);
                const film = await res.json();

                const synopsis = film.overview || "Désolé, aucun résumé n'est disponible pour ce film.";
                const genres   = film.genres ? film.genres.map(g => g.name).join(', ') : 'N/A';
                const year     = film.release_date ? film.release_date.slice(0, 4) : 'N/A';
                const duration = film.runtime ? `${film.runtime} min` : 'N/A';
                const poster   = film.poster_path ? IMG_URL + film.poster_path : '';

                document.title = `${film.title} - Critiverse`;

                document.getElementById('film-details-target').innerHTML = `
                    <div class="film-info">
                        <div class="film-top">
                            <div class="film-cover">
                                <img src="${poster}" alt="${film.title}">
                            </div>
                            <div class="film-summary">
                                <h1>${film.title}</h1>
                                <p><strong>Année :</strong> ${year}</p>
                                <p><strong>Durée :</strong> ${duration}</p>
                                <p><strong>Genres :</strong> ${genres}</p>
                                <p><strong>Note TMDB :</strong> ⭐ ${film.vote_average ? film.vote_average.toFixed(1) : 'N/A'}/10</p>
                                <div class="synopsis-box">
                                    <strong>Résumé :</strong><br>
                                    ${synopsis}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="rating-section">
                        <h2>Donnez votre avis</h2>
                        <div class="star-rating">
                            <input type="radio" name="star" id="star5" value="5"><label for="star5">★</label>
                            <input type="radio" name="star" id="star4" value="4"><label for="star4">★</label>
                            <input type="radio" name="star" id="star3" value="3"><label for="star3">★</label>
                            <input type="radio" name="star" id="star2" value="2"><label for="star2">★</label>
                            <input type="radio" name="star" id="star1" value="1"><label for="star1">★</label>
                        </div>
                        <p id="rating-label">Sélectionnez une note</p>
                        <textarea id="comment-text" placeholder="Alors, chef-d'œuvre ou déception ?"></textarea>
                        <button id="submit-rating" onclick="publishReview()">Publier mon avis</button>
                    </div>
                `;

                document.querySelectorAll('input[name="star"]').forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        selectedScore = e.target.value;
                        document.getElementById('rating-label').innerText = `Ma note : ${selectedScore}/5`;
                    });
                });

                showStoredReviews();

            } catch (err) {
                console.error(err);
                document.getElementById('film-details-target').innerHTML = "<p>Erreur lors du chargement du film.</p>";
            }
        }

        function publishReview() {
            const comment = document.getElementById('comment-text').value;
            if (selectedScore === 0) return alert("N'oubliez pas de mettre des étoiles !");
            if (comment.trim() === "") return alert("Laissez un petit commentaire.");

            const reviewData = {
                score: selectedScore,
                text: comment,
                date: new Date().toLocaleDateString('fr-FR')
            };

            let allReviews = JSON.parse(localStorage.getItem(`film_reviews_${movieId}`)) || [];
            allReviews.push(reviewData);
            localStorage.setItem(`film_reviews_${movieId}`, JSON.stringify(allReviews));

            document.getElementById('comment-text').value = "";
            selectedScore = 0;
            document.querySelectorAll('input[name="star"]').forEach(r => r.checked = false);
            document.getElementById('rating-label').innerText = "Sélectionnez une note";
            alert("Merci ! Votre avis a été publié.");
            showStoredReviews();
        }

        function showStoredReviews() {
            const list    = document.getElementById('reviews-list');
            const reviews = JSON.parse(localStorage.getItem(`film_reviews_${movieId}`)) || [];

            if (reviews.length === 0) return;

            list.innerHTML = reviews.reverse().map(r => `
                <div class="review-card">
                    <div class="review-header">
                        <span class="stars-display">${"★".repeat(r.score)}${"☆".repeat(5 - r.score)}</span>
                        <span class="review-date">Le ${r.date}</span>
                    </div>
                    <p>${r.text}</p>
                </div>
            `).join('');
        }

        loadFilmData();
    </script>

    <script src="../scripts/critiverse.js"></script>
</body>
</html>
