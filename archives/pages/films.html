 <script>
    const API_KEY = '7f41925d9303e23359cf5a62ee62de74';
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMG_URL  = 'https://image.tmdb.org/t/p/w500';

    async function loadMovies(query = '') {
        const endpoint = query
            ? `/search/movie?api_key=${API_KEY}&language=fr-FR&query=${encodeURIComponent(query)}`
            : `/movie/popular?api_key=${API_KEY}&language=fr-FR`;

        const res  = await fetch(`${BASE_URL}${endpoint}`);
        const data = await res.json();

        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';

        data.results.filter(movie => movie.poster_path).forEach(movie => {
            const div = document.createElement('div');
            div.className = 'gallery';
            div.innerHTML = `
                <img src="${IMG_URL}${movie.poster_path}" alt="${movie.title}" style="cursor:pointer" onclick="showModal('${movie.title.replace(/'/g, "\\'")}', '${(movie.overview || 'Aucun synopsis.').replace(/'/g, "\\'")}', '${movie.poster_path}')">
                <p>${movie.title}</p>
                <p>★ ${movie.vote_average.toFixed(1)}</p>
            `;
            gallery.appendChild(div);
        });
    }

    function showModal(title, synopsis, poster) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-synopsis').textContent = synopsis;
        document.getElementById('modal-poster').src = IMG_URL + poster;
        document.getElementById('modal').style.display = 'flex';
    }

    document.addEventListener('click', e => {
        if (e.target.id === 'modal') document.getElementById('modal').style.display = 'none';
    });

    document.querySelector('.search button').addEventListener('click', () => {
        loadMovies(document.querySelector('.search input').value);
    });

    document.querySelector('.search input').addEventListener('keydown', e => {
        if (e.key === 'Enter') loadMovies(e.target.value);
    });

    loadMovies();
</script>
<div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; justify-content:center; align-items:center;">
    <div style="background:white; border-radius:12px; padding:24px; max-width:500px; width:90%; display:flex; gap:20px; position:relative;">
        <img id="modal-poster" style="width:150px; border-radius:8px; object-fit:cover;">
        <div>
            <h2 id="modal-title" style="margin:0 0 12px;"></h2>
            <p id="modal-synopsis" style="font-size:14px; line-height:1.6; color:#333;"></p>
        </div>
        <span onclick="document.getElementById('modal').style.display='none'" style="position:absolute; top:12px; right:16px; cursor:pointer; font-size:20px;">✕</span>
    </div>
