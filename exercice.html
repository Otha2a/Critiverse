    <script>
        
            document.getElementById("btnSupprimer").addEventListener("click", function() {
                document.getElementById("message").remove();
            });
        

        function ajouter () {
            let nouveauParagraphe = document.createElement("h1");
            nouveauParagraphe.innerHTML = "Je viens d'être créer " ; 
            document.body.appendChild(nouveauParagraphe); 
        }

        function rendreNoir() {
            document.getElementById("message").style.color = "black";
        }
        function rendreRouge() {
            document.getElementById("message").style.color = "red";
        }
        function direBonjour() {
            document.getElementById("message").innerHTML = "Bonjour !";
        }
        function Effacer() 
        {
            document.getElementById("message").innerHTML = "Nouveau texte  !";
        }
</script>
